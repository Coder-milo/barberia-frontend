<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Barbexa</title>
  <link rel="icon" type="image/png" href="../assets/img/logo2.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/login.css">

</head>
<body>
  <div class="background"></div>

  <!-- Contenedor principal -->
  <div class="login-box">
    <!-- Logo arriba del login -->
    <div class="logo">
      <img src="../assets/img/logo.png" alt="Barbexa Logo">
    </div>

  
<!-- Divider -->
      <div class="divider-text"><span><h2 style="color: #f0e6c8; /* dorado claro */
text-shadow: 0 0 12px rgba(212,175,55,.25);">LOGIN</h2></span></div>

    <!-- Inputs -->
    <form>
      <div class="input-group">
        <input type="text" placeholder="User" required>
      </div>
      <div class="input-group">
        <input type="password" placeholder="Password" required>
      </div>

      <!-- Opciones -->
      <div class="options">
        <label><input type="checkbox"> Remaind me</label>
        <a href="#">Forgot your password?</a>
      </div>

      <!-- Botón -->
      <button type="submit" class="btn">Login</button>

      <!-- Registro -->
      <p class="register-text">
        Don't have an account yet? <a href="register.html">Register</a>
      </p>
    </form>
  </div>
  <script src="../js/login.js"></script>
</body>
</html>
